aid: 2ndnature
name: 2NDNATURE
description: 2NDNATURE is a Santa Cruz, California environmental technology company
  that builds cloud-based stormwater management and water-quality software. Its flagship
  product, 2NFORM, is GIS-powered MS4/NPDES compliance software that helps municipalities
  automate stormwater permit reporting, track assets and BMPs, detect illicit discharges,
  and run construction and post-construction programs. Rainsteward is its corporate
  water-stewardship platform for reducing costs and maximizing the value of stormwater
  investments. The company embeds peer-reviewed environmental science into an enterprise
  SaaS platform and is backed by Techstars. No public developer API program has been
  identified; the 2NFORM and Rainsteward applications are gated SaaS logins.
